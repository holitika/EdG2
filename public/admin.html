<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin · Bitácora EdG</title>
<link rel="stylesheet" href="/app.css">
<style>
html,body{margin:0;background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.c{font-family:var(--font-mono)}
.off{opacity:.5}
.scroll{overflow-x:auto}
.dv{font-size:13px;margin-top:4px}.btn.kick{padding:2px 8px;font-size:12px;margin-left:4px}.mu{color:var(--muted);font-size:12px}.sig{font-size:12px;margin-top:4px;font-weight:600}.sig.warn{color:#f59e0b}.sig.ok{color:#34d399}
</style></head>
<body>
<div class="screen" style="max-width:820px">
  <div class="card">
    <div class="eyebrow">Administración</div>
    <h1>Códigos de acceso</h1>
    <p>Crea un código por cada persona que compra. Entrégaselo por mensaje: con él entra a la bitácora y su avance queda guardado.</p>
    <label class="fl" for="tok">Clave de administración</label>
    <input class="in" id="tok" type="password" autocomplete="off" placeholder="La que definiste en ADMIN_TOKEN">
    <div class="row2">
      <div><label class="fl" for="note">Nota (a quién se lo das)</label><input class="in" id="note" maxlength="80" placeholder="Ej.: Camila, pago 12 oct"></div>
      <div><label class="fl" for="n">Cantidad</label><input class="in" id="n" type="number" min="1" max="50" value="1"></div>
    </div>
    <div class="acts"><button class="btn" id="create">Crear código</button><button class="btn ghost" id="refresh">Ver todos</button></div>
    <div id="msg" role="status"></div>
  </div>
  <div class="card" style="margin-top:14px" id="listCard" hidden>
    <div class="scroll"><table><thead><tr><th>Código</th><th>Nota</th><th>Creado</th><th>Primer uso</th><th>Dispositivos</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const tokKey='edg-admin';
try{$('tok').value=sessionStorage.getItem(tokKey)||'';}catch(e){}
function say(t,c){$('msg').innerHTML=t?'<div class="msg '+(c||'')+'">'+t+'</div>':'';}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){
  const tok=$('tok').value.trim(); try{sessionStorage.setItem(tokKey,tok);}catch(e){}
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':tok},body:JSON.stringify(body)});
  if(r.status===401)throw new Error('La clave de administración no es correcta.');
  if(!r.ok)throw new Error('Error del servidor ('+r.status+').');
  return r.json();
}
async function load(){
  const d=await call({action:'list'});
  $('listCard').hidden=false;
  $('rows').innerHTML=d.rows.map(x=>'<tr class="'+(x.active?'':'off')+'"><td class="c">'+esc(x.code)+'</td><td>'+esc(x.note)+'</td><td>'+esc((x.created||'').slice(0,10))+'</td><td>'+esc(x.firstUse?x.firstUse.slice(0,10):'Sin usar')+'</td><td>'+detail(x)+'</td><td><button class="btn ghost sm" data-code="'+esc(x.code)+'" data-a="reset_devices">Liberar dispositivos</button> <button class="btn ghost sm" data-code="'+esc(x.code)+'" data-a="'+(x.active?'revoke':'restore')+'">'+(x.active?'Desactivar':'Reactivar')+'</button></td></tr>').join('')||'<tr><td colspan="6">Aún no hay códigos.</td></tr>';
}
const d10=t=>esc((t||'').slice(0,10).split('-').reverse().join('/'));
function signals(x){
  const out=[];
  if(x.blocked>=1)out.push(x.blocked+' intento'+(x.blocked>1?'s':'')+' bloqueado'+(x.blocked>1?'s':'')+' (otro aparato quiso entrar)');
  if(x.resets>=2)out.push('liberado '+x.resets+' veces');
  const labs=x.devList.map(d=>d.label);
  if(labs.length>1&&new Set(labs).size<labs.length)out.push('dos aparatos del mismo tipo');
  const ids=new Set((x.downloadLog||[]).map(d=>d.dev));
  if(ids.size>=2)out.push('descargas desde '+ids.size+' aparatos');
  if(x.downloads>=4)out.push(x.downloads+' descargas del material');
  return out;
}
function detail(x){
  const sg=signals(x);
  let h='<b>'+esc(x.devices+' / '+x.max)+'</b> dispositivos';
  h+=x.devList.map(d=>'<div class="dv">'+esc(d.label)+' <span class="mu">desde '+d10(d.first)+', visto '+d10(d.last)+'</span> <button class="btn ghost sm kick" data-code="'+esc(x.code)+'" data-a="kick_device" data-dev="'+esc(d.fid)+'" data-lbl="'+esc(d.label)+'">Cerrar sesión</button></div>').join('');
  h+='<div class="mu">Bloqueos: '+x.blocked+' · Liberaciones: '+x.resets+' · Descargas: '+x.downloads+'</div>';
  if(x.blockedLog.length)h+='<div class="mu">Intentos bloqueados: '+x.blockedLog.map(b=>esc(b.label)+' ('+d10(b.t)+')').join(', ')+'</div>';
  h+=sg.length?'<div class="sig warn">⚠ Revisar: '+sg.map(esc).join('; ')+'</div>':(x.devices?'<div class="sig ok">Sin señales raras</div>':'');
  return h;
}$('create').onclick=async()=>{
  say('Creando…');
  try{
    const d=await call({action:'create',n:$('n').value,note:$('note').value});
    say('Listo. Código'+(d.codes.length>1?'s':'')+': <b style="font-family:var(--font-mono)">'+d.codes.map(esc).join(' · ')+'</b>','ok');
    await load();
  }catch(e){say(esc(e.message),'bad');}
};
$('refresh').onclick=async()=>{say('');try{await load();}catch(e){say(esc(e.message),'bad');}};
$('rows').onclick=async ev=>{
  const b=ev.target.closest('button[data-code]'); if(!b)return;
  const body={action:b.dataset.a,code:b.dataset.code};
  if(b.dataset.a==='kick_device'){
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='¿Confirmar?';setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent='Cerrar sesión';}},4000);return;}
    body.device=b.dataset.dev;
  }
  try{await call(body);await load();if(body.device)say('Sesión cerrada en '+esc(b.dataset.lbl||'ese dispositivo')+'. El cupo quedó libre.','ok');}catch(e){say(esc(e.message),'bad');}
};
</script>
</body></html>
