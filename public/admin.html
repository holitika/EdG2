<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin · Bitácora EdG</title>
<link rel="stylesheet" href="/app.css">
<style>
html,body{margin:0;background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.c{font-family:var(--font-mono)}
.off{opacity:.5}
.scroll{overflow-x:auto}
</style></head>
<body>
<div class="screen" style="max-width:820px">
  <div class="card">
    <div class="eyebrow">Administración</div>
    <h1>Códigos de acceso</h1>
    <p>Crea un código por cada persona que compra. Entrégaselo por mensaje: con él entra a la bitácora y su avance queda guardado.</p>
    <label class="fl" for="tok">Clave de administración</label>
    <input class="in" id="tok" type="password" autocomplete="off" placeholder="La que definiste en ADMIN_TOKEN">
    <div class="row2">
      <div><label class="fl" for="note">Nota (a quién se lo das)</label><input class="in" id="note" maxlength="80" placeholder="Ej.: Camila, pago 12 oct"></div>
      <div><label class="fl" for="n">Cantidad</label><input class="in" id="n" type="number" min="1" max="50" value="1"></div>
    </div>
    <div class="acts"><button class="btn" id="create">Crear código</button><button class="btn ghost" id="refresh">Ver todos</button></div>
    <div id="msg" role="status"></div>
  </div>
  <div class="card" style="margin-top:14px" id="listCard" hidden>
    <div class="scroll"><table><thead><tr><th>Código</th><th>Nota</th><th>Creado</th><th>Primer uso</th><th>Dispositivos</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const tokKey='edg-admin';
try{$('tok').value=sessionStorage.getItem(tokKey)||'';}catch(e){}
function say(t,c){$('msg').innerHTML=t?'<div class="msg '+(c||'')+'">'+t+'</div>':'';}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){
  const tok=$('tok').value.trim(); try{sessionStorage.setItem(tokKey,tok);}catch(e){}
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':tok},body:JSON.stringify(body)});
  if(r.status===401)throw new Error('La clave de administración no es correcta.');
  if(!r.ok)throw new Error('Error del servidor ('+r.status+').');
  return r.json();
}
async function load(){
  const d=await call({action:'list'});
  $('listCard').hidden=false;
  $('rows').innerHTML=d.rows.map(x=>'<tr class="'+(x.active?'':'off')+'"><td class="c">'+esc(x.code)+'</td><td>'+esc(x.note)+'</td><td>'+esc((x.created||'').slice(0,10))+'</td><td>'+esc(x.firstUse?x.firstUse.slice(0,10):'Sin usar')+'</td><td>'+esc(x.devices+' / '+x.max)+(x.lastSeen?'<br><span style="color:var(--muted);font-size:12px">visto '+esc(x.lastSeen.slice(0,10))+'</span>':'')+'</td><td><button class="btn ghost sm" data-code="'+esc(x.code)+'" data-a="reset_devices">Liberar dispositivos</button> <button class="btn ghost sm" data-code="'+esc(x.code)+'" data-a="'+(x.active?'revoke':'restore')+'">'+(x.active?'Desactivar':'Reactivar')+'</button></td></tr>').join('')||'<tr><td colspan="6">Aún no hay códigos.</td></tr>';
}
$('create').onclick=async()=>{
  say('Creando…');
  try{
    const d=await call({action:'create',n:$('n').value,note:$('note').value});
    say('Listo. Código'+(d.codes.length>1?'s':'')+': <b style="font-family:var(--font-mono)">'+d.codes.map(esc).join(' · ')+'</b>','ok');
    await load();
  }catch(e){say(esc(e.message),'bad');}
};
$('refresh').onclick=async()=>{say('');try{await load();}catch(e){say(esc(e.message),'bad');}};
$('rows').onclick=async ev=>{
  const b=ev.target.closest('button[data-code]'); if(!b)return;
  try{await call({action:b.dataset.a,code:b.dataset.code});await load();}catch(e){say(esc(e.message),'bad');}
};
</script>
</body></html>
